<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body class="editor">
  <form id="form" novalidate>
    <div class="row two">
      <label class="field">
        <span>Version</span>
        <input id="label" type="text" autocomplete="off" required>
      </label>
      <label class="field">
        <span>Date</span>
        <input id="date" type="date">
      </label>
    </div>

    <div class="field">
      <span>Status</span>
      <div id="statuses" class="seg" role="radiogroup" aria-label="Status"></div>
    </div>

    <div class="field">
      <span>Time spent on this version</span>
      <div class="time-row">
        <input id="time" type="text" inputmode="text" placeholder="1:30" autocomplete="off" aria-describedby="timeHint">
        <button type="button" class="btn ghost small" data-add="15">+15m</button>
        <button type="button" class="btn ghost small" data-add="30">+30m</button>
        <button type="button" class="btn ghost small" data-add="60">+1h</button>
      </div>
      <p id="timeHint" class="hint">Type it as 1:30, 1h 30m, 90m or 1.5h.</p>
      <p id="runningNote" class="hint running-note" hidden>The timer is running on this version. It will keep counting from the time you save.</p>
    </div>

    <div class="field">
      <span>Proof file <em>(optional)</em></span>
      <div class="row file-row">
        <input id="fileLabel" type="text" placeholder="Name (e.g. Proof v2)" autocomplete="off">
        <input id="fileUrl" type="url" placeholder="https://… (SharePoint or Trello attachment)" autocomplete="off">
      </div>
      <button type="button" id="pickFile" class="btn ghost small">Choose from card attachments</button>
      <div id="filePicker" class="file-picker" hidden></div>
    </div>

    <label class="field">
      <span>Notes <em>(optional)</em></span>
      <textarea id="notes" rows="3" placeholder="What changed, what the client asked for…"></textarea>
    </label>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="actions">
      <button type="button" id="deleteBtn" class="btn danger" hidden>Delete version</button>
      <span class="spacer"></span>
      <button type="button" id="cancelBtn" class="btn ghost">Cancel</button>
      <button type="submit" class="btn primary">Save version</button>
    </div>
  </form>
  <script src="./js/proofs.js"></script>
  <script src="./js/version.js"></script>
</body>
</html>
